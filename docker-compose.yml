services:
  postgres:
    image: debezium/postgres:13
    container_name: postgres_cdc
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_MAX_PREPARED_TRANSACTIONS: 100
      POSTGRES_MAX_CONNECTIONS: 100
    ports:
      - "5433:5432"
    networks:
      - cdc-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_backup:/backup
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./ssl:/ssl-files:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: postgres:postgres
  postgres_backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres_backup
    restart: always
    volumes:
      - ./postgres_backup:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=mydb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    networks:
      - cdc-network
    depends_on:
      - postgres

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: '*'
      ZOOKEEPER_ADMIN_ENABLE_SERVER: 'false'
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT_ADDRESS: 0.0.0.0
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
      - ./zookeeper_backup:/backup
    networks:
      - cdc-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 1000000
      KAFKA_COMPRESSION_TYPE: "snappy"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_CLEANER_DELETE_RETENTION_MS: 86400000
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: 0.5
      KAFKA_QUOTA_WINDOW_SIZE_SECONDS: 1
      KAFKA_QUOTA_WINDOW_NUM: 11
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka_backup:/backup
    depends_on:
      - zookeeper
    networks:
      - cdc-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka2:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka2
    restart: always
    ports:
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 1000000
      KAFKA_COMPRESSION_TYPE: "snappy"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_CLEANER_DELETE_RETENTION_MS: 86400000
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: 0.5
      KAFKA_QUOTA_WINDOW_SIZE_SECONDS: 1
      KAFKA_QUOTA_WINDOW_NUM: 11
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false"
    volumes:
      - kafka2_data:/var/lib/kafka/data
      - ./kafka2_backup:/backup
    depends_on:
      - zookeeper
    networks:
      - cdc-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka3:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka3
    restart: always
    ports:
      - "29094:29094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 1000000
      KAFKA_COMPRESSION_TYPE: "snappy"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_CLEANER_DELETE_RETENTION_MS: 86400000
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: 0.5
      KAFKA_QUOTA_WINDOW_SIZE_SECONDS: 1
      KAFKA_QUOTA_WINDOW_NUM: 11
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false"
    volumes:
      - kafka3_data:/var/lib/kafka/data
      - ./kafka3_backup:/backup
    depends_on:
      - zookeeper
    networks:
      - cdc-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-connect:
      image: confluentinc/cp-kafka-connect:7.4.0
      container_name: kafka_connect
      restart: always
      ports:
        - "8084:8083"
      environment:
        CONNECT_BOOTSTRAP_SERVERS: "kafka:9092,kafka2:9092,kafka3:9092"
        CONNECT_GROUP_ID: "connect-cluster"
        CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
        CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
        CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
        CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
        CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
        CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
        CONNECT_PRODUCER_COMPRESSION_TYPE: "snappy"
        CONNECT_REQUEST_TIMEOUT_MS: "20000"
        CONNECT_RETRY_BACKOFF_MS: "500"
        CONNECT_TOOLS_LOG4J_LOGLEVEL: "INFO"
        CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
        CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
        CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
        CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
        CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
        CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      volumes:
        - ./config/kafka-connect/connectors:/etc/kafka-connect/connectors:ro
        - ./config/hadoop/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
        - ./config/hadoop/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
        - ./config/hadoop:/opt/hadoop/etc/hadoop:ro


      command: 
        - bash 
        - -c 
        - |
          echo "Installing connectors..."
          confluent-hub install --no-prompt debezium/debezium-connector-postgresql:1.9.7
          confluent-hub install --no-prompt confluentinc/kafka-connect-hdfs3:1.1.18
          echo "Launching Kafka Connect worker..."
          /etc/confluent/docker/run
      depends_on:
        - kafka
        - kafka2
        - kafka3
        - postgres
        - namenode
      networks:
        - cdc-network
  
  connector-setup:
    image: appropriate/curl
    container_name: connector_setup
    depends_on:
      - kafka-connect
    volumes:
      - ./connectors:/connectors
    networks:
      - cdc-network
    entrypoint: >
      sh -c "sleep 40 &&
             for f in /connectors/*.json; do
               echo \"Registering connector from $$f\";
               curl -X POST -H 'Content-Type: application/json' --data @$$f http://kafka-connect:8083/connectors;
             done"

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    environment:
      - CLUSTER_NAME=hadoop_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=3
      - HDFS_CONF_dfs_namenode_handler_count=100
      - HDFS_CONF_dfs_permissions_enabled=true
      - HDFS_CONF_dfs_namenode_datanode_registration_ip-hostname-check=false
      - HDFS_CONF_dfs_namenode_name_dir_restore=true
      - HDFS_CONF_dfs_namenode_edits_dir=/hadoop/dfs/name
      - HDFS_CONF_dfs_namenode_backup_address=namenode:50100
      - HDFS_CONF_dfs_namenode_backup_http_address=namenode:50105
    ports:
      - "9871:9870"  
      - "8021:8020"  
      - "50101:50100" 
    networks:
      - cdc-network
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./hadoop_backup:/backup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 3

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: always
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_datanode_data_dir=/hadoop/dfs/data
      - HDFS_CONF_dfs_datanode_handler_count=50
      - HDFS_CONF_dfs_datanode_max_transfer_threads=8192
    depends_on:
      - namenode
    networks:
      - cdc-network
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
      - ./datanode1_backup:/backup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9864"]
      interval: 30s
      timeout: 10s
      retries: 3

  datanode2:
    extends:
      service: datanode1
    container_name: datanode2
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
      - ./datanode2_backup:/backup

  datanode3:
    extends:
      service: datanode1
    container_name: datanode3
    volumes:
      - hadoop_datanode3:/hadoop/dfs/data
      - ./datanode3_backup:/backup
  
  hdfs_backup:
    image: bde2020/hadoop-base:2.0.0-hadoop3.2.1-java8
    command: ["hdfs", "dfs", "-backup", "/data", "/backup"]
    depends_on:
      - namenode
    volumes:
      - ./hadoop_backup:/backup

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: always
    ports:
      - "9091:9090" 
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - cdc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: always
    ports:
      - "3001:3000" 
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - cdc-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    restart: always
    ports:
      - "9095:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    networks:
      - cdc-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  kafka2_data:
  kafka3_data:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  prometheus_data:
  grafana_data:           
  alertmanager_data:      
  
networks:
  cdc-network:
    driver: bridge